<nav>
  <div>
    <a href="/">Dashboard</a>
    {{if .User}}
    <a href="/targets/deleted">Deleted</a>
    {{end}}
    {{if .CanWrite}}
    <a href="/import">Import</a>
    {{end}}
    {{if .IsAdmin}}
    <a href="/settings">Settings</a>
    {{end}}
  </div>
  {{if .User}}
  <div class="nav-right">
    <a href="/account" style="margin-right: 0;">{{.User.Email}}</a>
    <form method="POST" action="/logout" style="display:inline;">
      <button type="submit">Logout</button>
    </form>
  </div>
  {{end}}
</nav>
<div class="container">
{{with .Flash}}
{{if eq .Kind "error"}}
<div class="alert alert-error" role="alert">{{.Message}}</div>
{{else}}
<div class="alert alert-success" role="status">{{.Message}}</div>
{{end}}
{{end}}
