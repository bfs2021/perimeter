{{template "views/partials/header" .}}

<h1>Set up two-factor authentication</h1>

<p class="text-muted" style="margin-bottom: 16px;">Scan this code with your authenticator app, or enter the key by hand.</p>

<img src="{{.QRCode}}" alt="QR code for your authenticator app"
  style="width: 200px; height: 200px; image-rendering: pixelated; margin-bottom: 16px;">

<p style="margin-bottom: 24px;">Key: <span class="mono">{{.Secret}}</span></p>

<form action="/account/2fa/confirm" method="POST">
  <div class="form-group">
    <label for="code">Code from your app</label>
    <input type="text" name="code" id="code" required autofocus inputmode="numeric" autocomplete="one-time-code" style="width: 200px;">
  </div>
  <button type="submit" class="btn-primary">Confirm</button>
  <a href="/account" style="margin-left: 12px;">Cancel</a>
</form>
